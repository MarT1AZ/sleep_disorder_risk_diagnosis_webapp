version: "1"
services:
  ml_backend:
    build: ./backend
    networks:
      - gateway_2_backend
  
  nginx_gateway:
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - ml_backend
    networks:
      - gateway_2_backend

  frontend_prod:
    build: ./frontend
    ports:
       - "3000:80"
    depends_on:
      - nginx_gateway

networks:
  gateway_2_backend:
    driver: bridge

  

